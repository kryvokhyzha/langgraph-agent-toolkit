version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "09:00"
      timezone: "Europe/Kyiv"
    cooldown:
      default-days: 7
    groups:
      actions-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "github-actions"

  # Use the uv updater to keep pyproject.toml and uv.lock consistent.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "09:00"
      timezone: "Europe/Kyiv"
    cooldown:
      default-days: 7
    groups:
      # Keep security fixes separate from routine updates.
      python-security:
        applies-to: "security-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      # Review major upgrades separately.
      agent-framework:
        patterns:
          - "langchain*"
          - "langgraph*"
          - "deepagents"
          - "fastmcp"
          - "mcp"
          - "openai"
          - "anthropic"
          - "google-genai"
        update-types:
          - "minor"
          - "patch"
      observability:
        patterns:
          - "langfuse"
          - "langsmith"
          - "opentelemetry*"
        update-types:
          - "minor"
          - "patch"
      development-tools:
        patterns:
          - "pytest*"
          - "coverage"
          - "pre-commit"
          - "ruff"
          - "sphinx*"
        update-types:
          - "minor"
          - "patch"
      python-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"

  - package-ecosystem: "docker"
    directories:
      - "/docker/api"
      - "/docker/app"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "09:30"
      timezone: "Europe/Kyiv"
    cooldown:
      default-days: 7
    groups:
      # Keep both application images on the same base image versions.
      application-images:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 1
    labels:
      - "dependencies"

  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "09:30"
      timezone: "Europe/Kyiv"
    cooldown:
      default-days: 7
    groups:
      # Group hook revisions without a semantic-version filter.
      # Review major tool changes in this PR. CI runs the configured hooks.
      hooks:
        patterns:
          - "*"
    open-pull-requests-limit: 1
    labels:
      - "dependencies"
