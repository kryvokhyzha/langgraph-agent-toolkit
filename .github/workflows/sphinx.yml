name: Build and Deploy Sphinx Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/sphinx.yml"
      - "langgraph_agent_toolkit/**"
      - "pyproject.toml"
      - "uv.lock"
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/sphinx.yml"
      - "langgraph_agent_toolkit/**"
      - "pyproject.toml"
      - "uv.lock"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sphinx-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "0.12.1"
      - name: Install locked documentation and runtime dependencies
        run:
          uv sync --frozen --no-install-project --no-default-groups --extra all
          --group docs
      - name: Generate and build the complete documentation
        run: make -C docs html SPHINXOPTS="-a -E -W --keep-going"
      - name: Save the documentation site
        uses: actions/upload-artifact@v7
        with:
          name: documentation-site
          path: docs/_build/html
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: documentation-site
          path: docs/_build/html
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/_build/html
          force_orphan: true
          full_commit_message: "Docs: Update documentation site"
          enable_jekyll: false
