[build-system]
requires = ["hatchling", "tomli"]
build-backend = "hatchling.build"

[project]
name = "langgraph-agent-toolkit"
version = "0.10.1"
description = "Full toolkit for running an AI agent service built with LangGraph, FastAPI and Streamlit"
readme = "README.md"
authors = [
    { name = "Roman Kryvokhyzha", email = "kriwohizha@gmail.com" },
    { name = "Joshua Carroll", email = "carroll.joshk@gmail.com" },
]
keywords = ["langgraph", "agents", "fastapi", "streamlit", "litellm", "blueprint"]
license = "mit"
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

requires-python = ">=3.11,<3.15"

dependencies = [
    "rootutils >= 1.0.7",
    "filelock >= 3.18, < 4",
    "ddgs >= 9.5.0",
    "fastapi >= 0.136.3, < 0.136.4",  # This range uses the tested native JSON Lines streaming API.
    "httpx ~= 0.28.1",
    "langchain >= 1.4.0, < 1.5",
    "langchain-core >= 1.6.3, < 1.7",
    "langchain-community >= 0.4.2, < 0.4.3",
    "langgraph >= 1.2.11, < 1.3",
    "langgraph-checkpoint-sqlite >= 3.1.1, < 3.2",
    "langgraph-checkpoint-postgres >= 3.1.2, < 3.2",
    "langgraph-supervisor ~= 0.0.31",
    "psycopg[binary,pool] ~= 3.2.4",
    "pydantic >= 2.11.1, < 2.13.5; python_version < '3.14'",
    "pydantic >= 2.13.0, < 2.13.5; python_version >= '3.14'",  # This version supports legacy SDK models on Python 3.14.
    "pydantic-settings >= 2.9.1, < 2.14.2",
    "python-dotenv >= 1.1, < 1.3",
    "joblib >= 1.4.2",
    "uvicorn >= 0.35, < 0.50",
    "loguru ~= 0.7.3",
    "fire ~= 0.7.0",
    "Jinja2 ~= 3.1.6",
]

[dependency-groups]
dev = [
    {include-group = "lint"},
    {include-group = "tests"},
    {include-group = "docs"},
]
lint = [
    "pre-commit",
    "ruff",
]
tests = [
    "pytest",
    "pytest-cov",
    "pytest-env",
    "pytest-asyncio",
]
docs = [
    "sphinx",
    "sphinx-pyproject",
    "sphinx_rtd_theme",
]

# This group contains the minimum dependencies for the client and Streamlit app.
# This group does not install the package or its service dependencies.
# Run `uv sync --frozen --only-group client` to install this group.
client = [
    "httpx ~= 0.28.1",
    "pydantic >= 2.11.1, < 2.13.5; python_version < '3.14'",
    "pydantic >= 2.13.0, < 2.13.5; python_version >= '3.14'",
    "pydantic-settings >= 2.9.1, < 2.14.2",
    "python-dotenv >= 1.1, < 1.3",
    "streamlit >= 1.45, < 1.58.1",
    "loguru ~= 0.7.3",
    "watchdog ~= 6.0.0",
]

[project.optional-dependencies]

ui = [
    "streamlit >= 1.45, < 1.58.1",
    "watchdog ~= 6.0.0",
]

studio = [
    "langgraph-cli[inmem] >= 0.2.10, < 0.5.0",
    "jsonschema-rs >= 0.44.1; python_version >= '3.14'",  # This version provides compatible native wheels.
]

all = [
    "langgraph-agent-toolkit[ui,studio,mcp,deepagents,all-backends,all-llms,all-observability]",
]

# MCP tools for LangChain agents
mcp = [
    "langchain[mcp] >= 1.4.0, < 1.5",
    "fastmcp >= 4.0.3, < 4.1",
]

# Deep Agents adds context management, virtual files, and delegated work.
deepagents = [
    "deepagents >= 0.7.13, < 0.8",
]

# Service runner backends
aws-backend = [
    "mangum ~= 0.19.0",
]

azure-backend = [
    "azure-functions >= 1.23, < 1.25",
]

gunicorn-backend = [
    "gunicorn ~= 26.0.0",
    "uvicorn[standard] >= 0.35, < 0.50",
]

uvicorn-backend = [
    "uvicorn >= 0.35, < 0.50",
]

all-backends = [
    "langgraph-agent-toolkit[aws-backend,azure-backend,gunicorn-backend,uvicorn-backend]",
]

# Different LLM providers
aws = [
    "langchain-aws>=1.0.0,<1.7.6",
]

anthropic = [
    "langchain-anthropic >= 1.0.0, < 1.8",
]

google-vertexai = [
    "langchain-google-vertexai>=3.0.0,<3.2.5",
]

google-genai = [
    "langchain-google-genai >= 4.0.0, < 4.5",
]

openai = [
    "langchain-openai >= 1.6.2, < 1.7",
]

openai-aiohttp = [
    "langgraph-agent-toolkit[openai]",
    "openai[aiohttp] >= 3.13.0, < 4",
]

all-llms = [
    "langgraph-agent-toolkit[aws,anthropic,google-vertexai,google-genai,openai-aiohttp]",
]

# Observability tools and platforms
langfuse = [
    "langfuse >= 2.60.10, < 5",
]

langfuse-v2 = [
    "langfuse >= 2.60.10, < 3",
]

langfuse-v3 = [
    "langfuse >= 3.15.0, < 4",
]

langfuse-v4 = [
    "langfuse >= 4.15.2, < 5",
]

langsmith = [
    "langsmith >= 0.4.60, < 0.13",
]

all-observability = [
    "langgraph-agent-toolkit[langfuse,langsmith]",
]

[project.urls]
documentation = "https://kryvokhyzha.github.io/langgraph-agent-toolkit"
repository = "https://github.com/kryvokhyzha/langgraph-agent-toolkit"
"PyPI" = "https://pypi.org/project/langgraph-agent-toolkit"

[tool.hatch.build.targets.wheel]
packages = ["langgraph_agent_toolkit"]

[tool.uv]
conflicts = [
    [
        {extra = "langfuse-v2"},
        {extra = "langfuse-v3"},
        {extra = "langfuse-v4"},
    ],
]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude=[
    ".git",
    "__pycache__",
    ".ruff_cache",
    ".github",
    "build",
    "dist",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "D"]  # See https://beta.ruff.rs/docs/rules/ for all rules.
ignore=[
    "E203",         # Allow whitespace before `:` in slices formatted by Black.
    "E731",         # Allow assignment of a lambda expression.
    "E741",         # Allow variable names `l`, `O`, and `I`.
    "F403",         # Do not report names from star imports.
    "D100",         # Do not require a public-module docstring.
    "D101",         # Do not require a public-class docstring.
    "D102",         # Do not require a public-method docstring.
    "D103",         # Do not require a public-function docstring.
    "D104",         # Do not require a public-package docstring.
    "D105",         # Do not require a magic-method docstring.
    "D107",         # Do not require an `__init__` docstring.
    "D203",         # Do not require a blank line before a class docstring.
    "D213",         # Do not require the summary on the second line.
]

[tool.ruff.lint.per-file-ignores]
"scripts/python/*"=["E402"]
"langgraph_agent_toolkit/run_agent.py"=["E402"]
"langgraph_agent_toolkit/service/factory.py"=["F821"]

[tool.ruff.lint.isort]
lines-after-imports = 2

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
pythonpath = ["langgraph_agent_toolkit", "."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.pytest_env]
OPENAI_API_KEY = "sk-xxxxx-fake-openai-key"
# Tests use this fixed environment mode and ignore the local `.env` file.
# Tests override `settings.ENV_MODE` to verify error-detail gating in both modes.
ENV_MODE = "development"
USE_FAKE_MODEL = "true"
